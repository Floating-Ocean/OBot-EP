[project]
name = "obot-ep"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "web",
    ".venv",
    "data",
    # 这个模板文件里 `@@CLASS@@Plugin` 是给脚手架替换的占位符，不是合法标识符，
    # 所以它本身没法被 lint。真正要保证的是**生成出来的**插件能过 —— 那由
    # tests/scaffold_test.py（生成 → 契约检查 → py_compile）负责。
    "plugins/_template/backend/plugin.py",
]

[tool.ruff.lint]
# E/F/W = pycodestyle + pyflakes（真问题：未使用导入、未定义名字），
# I = import 排序，UP = 现代语法，B = bugbear，C4/SIM = 简化写法。
# 只开这些：这个仓库的注释是刻意写的设计理由，不为讨好 linter 而改代码。
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # 行长交给 formatter；中文注释按字符数算会被误伤
    "B008",  # FastAPI 的 Depends()/Query() 默认值本来就要写在签名里
    # startup/shutdown/health/versions 是*可选*扩展点：插件只实现自己需要的那些，
    # 基类里留空实现是有意的，加上 @abstractmethod 反而会强迫每个插件写空壳。
    "B027",
]

[tool.ruff.lint.per-file-ignores]
# 测试与插件包允许「先 import 再调用」：导入即注册是刻意的副作用
"tests/*" = ["E402"]
"plugins/*/__init__.py" = ["E402"]
